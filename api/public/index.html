<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Scraper Gateway</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --error-bg: #450a0a;
      --error-border: #dc2626;
      --error-text: #f87171;
      --success-badge: #10b981;
      --info-badge: #0ea5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    form {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      min-width: 280px;
    }

    input[type="url"],
    input[type="text"] {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background-color: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="url"]:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    button {
      padding: 0.85rem 1.75rem;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover:not(:disabled) {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Error Message Area */
    .error-container {
      display: none;
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .error-container strong {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 700;
    }

    /* Result Header & Status */
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .result-title {
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .status-badges {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-cache-hit {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--success-badge);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .badge-cache-miss {
      background-color: rgba(14, 165, 233, 0.2);
      color: var(--info-badge);
      border: 1px solid rgba(14, 165, 233, 0.4);
    }

    .badge-duration {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* Result JSON display */
    pre {
      background-color: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.25rem;
      overflow-x: auto;
      max-height: 520px;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    code {
      font-family: "JetBrains Mono", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .empty-state {
      color: #64748b;
      font-style: italic;
    }

    .spinner {
      border: 2px solid rgba(15, 23, 42, 0.25);
      border-top-color: currentColor;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Web Scraper Service</h1>
      <p>NestJS API Gateway, Service Python </p>
    </header>

    <!-- Extraction Form -->
    <div class="card">
      <form id="extract-form">
        <div class="input-group">
          <input 
            type="url" 
            id="url-input" 
            placeholder="https://example.com" 
            value="https://example.com" 
            required
            autocomplete="off"
          />
        </div>
        <button type="submit" id="submit-btn">
          <span id="btn-spinner" class="spinner" style="display: none;"></span>
          <span id="btn-text">Extract</span>
        </button>
      </form>
    </div>

    <!-- Error container -->
    <div id="error-box" class="error-container">
      <strong>Erreur :</strong>
      <div id="error-message"></div>
    </div>

    <!-- Results Section -->
    <div class="card">
      <div class="result-header">
        <span class="result-title">Résultat JSON</span>
        <div class="status-badges">
          <span id="duration-badge" class="badge-duration"></span>
          <span id="cache-badge" class="badge" style="display: none;"></span>
        </div>
      </div>
      <pre><code id="json-result" class="empty-state">Entrez une URL et cliquez sur "Extract" pour lancer le scraping...</code></pre>
    </div>
  </div>

  <script>
    const form = document.getElementById('extract-form');
    const urlInput = document.getElementById('url-input');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorBox = document.getElementById('error-box');
    const errorMessage = document.getElementById('error-message');
    const jsonResult = document.getElementById('json-result');
    const cacheBadge = document.getElementById('cache-badge');
    const durationBadge = document.getElementById('duration-badge');

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = 'Loading...';
        jsonResult.className = 'empty-state';
        jsonResult.textContent = 'Chargement des données en cours...';
        hideError();
        cacheBadge.style.display = 'none';
        durationBadge.textContent = '';
      } else {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Extract';
      }
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorBox.style.display = 'block';
    }

    function hideError() {
      errorBox.style.display = 'none';
      errorMessage.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;

      setLoading(true);
      const startTime = performance.now();

      try {
        const response = await fetch('/api/extract', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ url }),
        });

        const elapsed = Math.round(performance.now() - startTime);
        durationBadge.textContent = `${elapsed} ms`;

        const data = await response.json();

        if (!response.ok) {
          const detail = data.message 
            ? (Array.isArray(data.message) ? data.message.join(', ') : data.message)
            : (data.error || `Erreur serveur HTTP ${response.status}`);
          showError(detail);
          jsonResult.className = '';
          jsonResult.textContent = JSON.stringify(data, null, 2);
          return;
        }

        hideError();
        jsonResult.className = '';
        jsonResult.textContent = JSON.stringify(data, null, 2);

        cacheBadge.style.display = 'inline-block';
        if (data.cached === true) {
          cacheBadge.className = 'badge badge-cache-hit';
          cacheBadge.textContent = 'CACHE HIT';
        } else {
          cacheBadge.className = 'badge badge-cache-miss';
          cacheBadge.textContent = ' CACHE MISS';
        }

      } catch (err) {
        const elapsed = Math.round(performance.now() - startTime);
        durationBadge.textContent = `${elapsed} ms`;
        showError(`Impossible de contacter l'API Gateway: ${err.message}`);
        jsonResult.className = 'empty-state';
        jsonResult.textContent = 'Échec de la requête.';
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
